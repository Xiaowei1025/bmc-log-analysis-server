# Production HTTPS example for openEuler.  Replace the server name and the two
# certificate paths with the company-issued certificate before enabling it.
# Keep Uvicorn bound to 127.0.0.1; never expose port 8000 directly.

limit_req_zone $binary_remote_addr zone=bmc_login:10m rate=10r/m;

server {
    listen 80;
    server_name bmc-hub.internal.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bmc-hub.internal.example;

    ssl_certificate     /etc/pki/tls/certs/bmc-hub.crt;
    ssl_certificate_key /etc/pki/tls/private/bmc-hub.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 220m;
    client_body_timeout 60s;
    proxy_read_timeout 120s;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    location = /login {
        limit_req zone=bmc_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
