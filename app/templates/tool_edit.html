{% extends "base.html" %}
{% block content %}
<section class="page-heading compact-heading"><div><a class="back" href="/tools/{{ tool.id }}">← 返回工具详情</a><p class="eyebrow">工具内容维护</p><h1>修改工具介绍</h1><p>说明内容会统一保存为 Markdown，历史版本、下载次数和反馈不会改变。</p></div></section>
<form class="form editor-form glass" method="post" action="/tools/{{ tool.id }}/edit" enctype="multipart/form-data" data-tool-editor-form data-draft-key="tool-edit-{{ tool.id }}" data-draft-label="工具介绍草稿" data-pending-label="正在保存介绍…">
  {{ csrf_input(request) }}
  <div class="form-grid">
    <label class="span-2">工具名称<input name="name" value="{{ tool.name }}" required></label>
    <label class="span-2">功能简述<input name="short_description" value="{{ tool.short_description }}" required></label>
    {% include "_tool_description_editor.html" %}
    <label class="span-2">替换 Logo（可选）<input type="file" name="logo" accept="image/*"></label>
  </div>
  <div class="tool-edit-actions">
    <a class="button" href="/tools/{{ tool.id }}">取消编辑</a>
    <button class="button primary" type="submit">保存介绍</button>
  </div>
</form>
{% endblock %}
