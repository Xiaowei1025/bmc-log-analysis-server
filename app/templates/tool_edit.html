{% extends "base.html" %}{% block content %}<h1>修改工具介绍</h1><form class="form" method="post" action="/tools/{{ tool.id }}/edit" enctype="multipart/form-data">{{ csrf_input(request) }}<label>工具名称<input name="name" value="{{ tool.name }}" required></label><label>功能简述<input name="short_description" value="{{ tool.short_description }}" required></label><label>详细说明与使用方法<textarea name="details" required>{{ tool.details }}</textarea></label><label>替换 Logo（可选）<input type="file" name="logo" accept="image/*"></label><button>保存介绍</button></form>{% endblock %}
