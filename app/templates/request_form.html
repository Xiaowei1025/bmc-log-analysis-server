{% extends "base.html" %}{% block content %}
<section class="page-heading compact-heading"><div><a class="back" href="/requests">← 返回需求板</a><p class="eyebrow">提交需求</p><h1>描述你希望改善的事情</h1><p>请先说明现有痛点与预期效果。需求提交后会进入待评审队列，不代表已承诺实现。</p></div></section>
<form class="editor-form glass" method="post" action="/requests" data-draft-key="requirement-new" data-draft-label="需求草稿" data-pending-label="正在提交需求…">{{ csrf_input(request) }}<div class="form-grid"><label class="span-2">需求标题<input name="title" required maxlength="120" placeholder="例如：报告列表支持按机型和日期筛选"></label><label>需求类型<select name="category"><option value="feature">功能建议</option><option value="workflow">流程优化</option><option value="ui">界面体验</option><option value="knowledge">知识内容</option><option value="other">其他</option></select></label><label>评审节奏<input value="{{ cadence|default('每周') }} 集中评审" disabled></label><label class="span-2">问题与使用场景<textarea name="description" required placeholder="现在遇到了什么问题？在哪个页面、什么操作下出现？建议如何改进？"></textarea></label><label class="span-2">预期价值（可选）<textarea name="expected_value" placeholder="例如：减少重复沟通、缩短日志定位时间、便于团队知识沉淀"></textarea></label></div><button class="button primary">提交到需求板</button></form>
{% endblock %}
