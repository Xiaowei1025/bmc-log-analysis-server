<script>document.querySelectorAll('[data-stream-url]').forEach(button=>button.addEventListener('click',async()=>{const target=document.getElementById(button.dataset.streamTarget);let url=button.dataset.streamUrl;button.disabled=true;BmcMarkdown.renderTo(target,'正在连接模型…');try{const response=await fetch(url);if(!response.ok)throw new Error('请求失败');const reader=response.body.getReader(),decoder=new TextDecoder();let text='';while(true){const {done,value}=await reader.read();if(done)break;text+=decoder.decode(value,{stream:true});BmcMarkdown.renderTo(target,text);target.scrollTop=target.scrollHeight}}catch(error){BmcMarkdown.renderTo(target,'**分析失败：** '+error.message)}finally{button.disabled=false}}));</script>
