{% extends "base.html" %}{% block content %}<h1>发布工具</h1><p class="hint">发布后可持续新增版本；旧版本、下载次数和反馈都会保留。</p><form class="form" method="post" action="/tools" enctype="multipart/form-data">{{ csrf_input(request) }}<label>工具名称<input name="name" required></label><label>功能简述<input name="short_description" required></label><label>详细说明与使用方法<textarea name="details" required placeholder="支持多行，说明运行环境、参数、示例和注意事项。"></textarea></label><label>工具 Logo（可选）<input type="file" name="logo" accept="image/*"></label><label>首个版本号<input name="version" required placeholder="例如 1.0.0"></label><label>本版本更新说明<textarea name="release_notes" placeholder="首次发布"></textarea></label><label>工具文件<input type="file" name="package" required></label><button>发布工具</button></form>{% endblock %}
